<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin VISIONARY</title>

<style>
body{
  font-family:Arial;
  background:#f4f4f4;
  margin:0;
  padding:20px;
}

.container{
  max-width:600px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:10px;
  width:95%;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

input, textarea{
  width:100%;
  padding:10px;
  margin:5px 0;
  font-size:16px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:12px;
  background:black;
  color:white;
  border:none;
  cursor:pointer;
  margin-top:10px;
  font-size:16px;
}

img{
  max-width:100%;
}

h2,h3{
  text-align:center;
}

/* MODAL */
#modal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:flex-start;
  overflow-y:auto;
  padding:20px 0;
}

.modal-content{
  background:white;
  padding:20px;
  width:90%;
  max-width:500px;
  border-radius:10px;
  margin:auto;
}
</style>
</head>

<body>

<!-- 🟢 CREAR -->
<div class="container" id="pageCreate">

<h2>Panel Admin VISIONARY 🔥</h2>

<button onclick="mostrarLista()">📦 Ver productos</button>

<input id="nombre" placeholder="Nombre">
<input id="precio" placeholder="Precio">
<input id="precioAnterior" placeholder="Precio anterior">
<input id="categoria" placeholder="Categoría">
<input id="subcategoria" placeholder="Subcategoría">
<textarea id="descripcion" placeholder="Descripción"></textarea>

<h3>🖼 Imágenes</h3>

<label>Foto 1</label>
<input type="file" id="c_img1">

<label>Foto 2</label>
<input type="file" id="c_img2">

<label>Foto 3</label>
<input type="file" id="c_img3">

<label>Foto 4</label>
<input type="file" id="c_img4">

<h3>Variantes</h3>
<input id="color" placeholder="Color">
<input id="talla" placeholder="Talla">
<input id="stock" placeholder="Stock">

<button onclick="guardar()">Guardar producto</button>

</div>

<!-- 🔵 LISTA -->
<div class="container" id="pageEdit" style="display:none;">
<h2>📦 Productos</h2>
<button onclick="volver()">⬅ Volver</button>
<div id="lista2"></div>
</div>

<!-- 🧠 MODAL EDITAR -->
<div id="modal">
  <div class="modal-content">

    <h2>✏️ Editar producto</h2>

    <input id="e_nombre" placeholder="Nombre">
    <input id="e_precio" placeholder="Precio">
    <input id="e_precioAnterior" placeholder="Precio anterior">
    <input id="e_categoria" placeholder="Categoría">
    <input id="e_subcategoria" placeholder="Subcategoría">
    <textarea id="e_descripcion" placeholder="Descripción"></textarea>

    <h3>Imágenes actuales</h3>
    <img id="prev1">
    <img id="prev2">
    <img id="prev3">
    <img id="prev4">

    <h3>Nuevas imágenes</h3>

    <input type="file" id="e_img1">
    <input type="file" id="e_img2">
    <input type="file" id="e_img3">
    <input type="file" id="e_img4">

    <button onclick="actualizar()">💾 Guardar cambios</button>
    <button onclick="cerrarModal()">❌ Cerrar</button>

  </div>
</div>

<script>

const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbwQ_rX8KwOB09BL0IWfmqh-_JzIHErI8ce4zBcSZS0AfskdRAeFkKgm5KgR8MwlblgUcA/exec";

const CLOUD_NAME = "dfbryzre9";
const UPLOAD_PRESET = "visionary_upload";

// ===============================
// ☁️ SUBIR A CLOUDINARY
// ===============================
async function uploadImage(file){
  if(!file) return "";

  const form = new FormData();
  form.append("file", file);
  form.append("upload_preset", UPLOAD_PRESET);

  const res = await fetch(
    `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
    { method: "POST", body: form }
  );

  const data = await res.json();

  console.log("Cloudinary response:", data); // 👈 DEBUG CLAVE

  if(!data.secure_url){
    alert("❌ Error subiendo imagen a Cloudinary");
    return "";
  }

  return data.secure_url;
}

// ===============================
// 🚀 GUARDAR PRODUCTO
// ===============================
async function guardar(){

  const nombre = document.getElementById("nombre").value;
  const precio = document.getElementById("precio").value;
  const precioAnterior = document.getElementById("precioAnterior").value;
  const categoria = document.getElementById("categoria").value;
  const subcategoria = document.getElementById("subcategoria").value;
  const descripcion = document.getElementById("descripcion").value;

  const img1 = await uploadImage(document.getElementById("c_img1").files[0]);
  const img2 = await uploadImage(document.getElementById("c_img2").files[0]);
  const img3 = await uploadImage(document.getElementById("c_img3").files[0]);
  const img4 = await uploadImage(document.getElementById("c_img4").files[0]);

  const form = new FormData();

  form.append("action", "create");
  form.append("Nombre", nombre);
  form.append("Precio", precio);
  form.append("PrecioAnterior", precioAnterior);
  form.append("Categoria", categoria);
  form.append("Subcategoria", subcategoria);
  form.append("Descripcion", descripcion);

  // 🔥 IMÁGENES YA EN URL (Cloudinary)
  form.append("Imagen", img1);
  form.append("Imagen2", img2);
  form.append("Imagen3", img3);
  form.append("Imagen4", img4);

  await fetch(URL_SCRIPT, {
    method: "POST",
    body: form
  });

  alert("✅ Guardado correctamente");
  limpiar();
}

// ===============================
// 📦 LISTAR PRODUCTOS
// ===============================
function cargarProductos(){
  fetch(URL_SCRIPT)
  .then(r => r.json())
  .then(data => {

    let html = "";

    data.forEach(p => {

      html += `
        <div style="border:1px solid #ccc; padding:10px; margin:10px;">
          
          <b>${p.Nombre}</b><br>
          💰 ${p.Precio}<br>

          <div style="display:flex; gap:5px; margin-top:5px;">
            <img src="${p.Imagen || ''}" width="60">
            <img src="${p.Imagen2 || ''}" width="60">
            <img src="${p.Imagen3 || ''}" width="60">
            <img src="${p.Imagen4 || ''}" width="60">
          </div>

          <button onclick='abrirModal(${JSON.stringify(p)})'>
            Editar
          </button>

        </div>
      `;
    });

    document.getElementById("lista2").innerHTML = html;
  });
}

// ===============================
// ✏️ MODAL
// ===============================
let editingID = null;

function abrirModal(p){

  editingID = p.ID;

  document.getElementById("e_nombre").value = p.Nombre || "";
  document.getElementById("e_precio").value = p.Precio || "";
  document.getElementById("e_precioAnterior").value = p.PrecioAnterior || "";
  document.getElementById("e_categoria").value = p.Categoria || "";
  document.getElementById("e_subcategoria").value = p.Subcategoria || "";
  document.getElementById("e_descripcion").value = p.Descripcion || "";

  document.getElementById("prev1").src = p.Imagen || "";
  document.getElementById("prev2").src = p.Imagen2 || "";
  document.getElementById("prev3").src = p.Imagen3 || "";
  document.getElementById("prev4").src = p.Imagen4 || "";

  document.getElementById("modal").style.display = "flex";
  window.oldImages = {
  Imagen: p.Imagen || "",
  Imagen2: p.Imagen2 || "",
  Imagen3: p.Imagen3 || "",
  Imagen4: p.Imagen4 || ""
};
}

function cerrarModal(){
  document.getElementById("modal").style.display = "none";
}

// ===============================
// 💾 ACTUALIZAR PRODUCTO
// ===============================
async function actualizar(){

  const img1 = await uploadImage(document.getElementById("e_img1").files[0]);
  const img2 = await uploadImage(document.getElementById("e_img2").files[0]);
  const img3 = await uploadImage(document.getElementById("e_img3").files[0]);
  const img4 = await uploadImage(document.getElementById("e_img4").files[0]);

  const form = new FormData();

  form.append("action", "update");
  form.append("ID", editingID);

  form.append("Nombre", document.getElementById("e_nombre").value);
  form.append("Precio", document.getElementById("e_precio").value);
  form.append("PrecioAnterior", document.getElementById("e_precioAnterior").value);
  form.append("Categoria", document.getElementById("e_categoria").value);
  form.append("Subcategoria", document.getElementById("e_subcategoria").value);
  form.append("Descripcion", document.getElementById("e_descripcion").value);

  // 🔥 CLAVE: si no sube nueva imagen, usa la anterior
  form.append("Imagen", img1 || window.oldImages.Imagen);
  form.append("Imagen2", img2 || window.oldImages.Imagen2);
  form.append("Imagen3", img3 || window.oldImages.Imagen3);
  form.append("Imagen4", img4 || window.oldImages.Imagen4);

  await fetch(URL_SCRIPT, {
    method: "POST",
    body: form
  });

  alert("✅ Actualizado");
  cerrarModal();
  cargarProductos();
}

// ===============================
// 🧹 LIMPIAR
// ===============================
function limpiar(){
  document.getElementById("nombre").value = "";
  document.getElementById("precio").value = "";
  document.getElementById("precioAnterior").value = "";
  document.getElementById("categoria").value = "";
  document.getElementById("subcategoria").value = "";
  document.getElementById("descripcion").value = "";
}

// ===============================
// UI
// ===============================
function mostrarLista(){
  document.getElementById("pageCreate").style.display = "none";
  document.getElementById("pageEdit").style.display = "block";
  cargarProductos();
}

function volver(){
  document.getElementById("pageCreate").style.display = "block";
  document.getElementById("pageEdit").style.display = "none";
}

</script>
</body>
</html>

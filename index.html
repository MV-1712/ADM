<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<!-- 🔥 CLAVE PARA CELULAR -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Baby Shower 💖</title>

<style>
body {
  font-family: 'Segoe UI';
  background: #fff5f7;
  margin: 0;
  padding: 15px;
}

.container {
  max-width: 700px;
  margin: auto;
}

h1 {
  text-align: center;
  color: #ff6b81;
  font-size: 26px;
}

.mensaje {
  background: white;
  padding: 18px;
  border-radius: 15px;
  margin-bottom: 20px;
  text-align: center;
  font-size: 15px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 12px;
  border: 1px solid #ccc;
  font-size: 16px;
}

.card {
  background: white;
  padding: 15px;
  margin: 10px 0;
  border-radius: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: transform 0.2s;
  gap: 10px;
}

.card:hover {
  transform: scale(1.02);
}

button {
  background: #ff6b81;
  border: none;
  padding: 10px 14px;
  color: white;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  white-space: nowrap;
}

button:disabled {
  background: gray;
}

.resumen {
  margin-top: 30px;
  background: white;
  padding: 15px;
  border-radius: 15px;
}

/* TOAST */
#toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #ff6b81;
  color: white;
  padding: 12px 20px;
  border-radius: 20px;
  opacity: 0;
  transition: all 0.4s ease;
  font-weight: 500;
  z-index: 999;
}

/* 📱 RESPONSIVE */
@media (max-width: 600px) {

  h1 {
    font-size: 22px;
  }

  .mensaje {
    font-size: 14px;
  }

  .card {
    flex-direction: column;
    align-items: flex-start;
  }

  button {
    width: 100%;
  }

}
</style>
</head>

<body style="max-width:100vw; overflow-x:hidden;">

<div class="container">

<h1>💖 Baby Shower 💖</h1>

<div class="mensaje">
<p>
Nos llena de alegría invitarte 💕<br><br>
Tu compañía es nuestro mejor regalo, pero si deseas tener un detalle,
puedes elegir una opción de la lista 🎁
</p>
</div>

<input type="text" id="nombre" placeholder="Tu nombre ✨">

<div id="contenido"></div>

<h3>🔐 Ver resumen</h3>
<input type="password" id="clave" placeholder="Clave">
<button onclick="verResumen()">Ver</button>

<div id="resumen" class="resumen"></div>

<p style="text-align:center; margin-top:30px;">
📍 <a href="https://maps.google.com/?q=TU_UBICACION" target="_blank">Ver ubicación</a><br>
🕒 15:00
</p>

</div>

<div id="toast"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwJfvProeD5AX5uJQJdWnMTRrXnv06ZKBCx_Qc8bz4i2b_x7wTxpA7aVskv8uMkzeI/exec";
const CLAVE = "bebe2026";

/* MENSAJE BONITO */
function mostrarMensaje(texto) {
  const toast = document.getElementById("toast");
  toast.innerText = texto;

  toast.style.opacity = "1";
  toast.style.transform = "translateX(-50%) translateY(0)";

  setTimeout(() => {
    toast.style.opacity = "0";
    toast.style.transform = "translateX(-50%) translateY(100px)";
  }, 2500);
}

async function cargar() {
  try {
    const res = await fetch(API_URL + "?t=" + Date.now());
    const data = await res.json();

    const cont = document.getElementById("contenido");
    cont.innerHTML = "";

    const categorias = {};

    data.forEach(item => {
      if (!categorias[item.categoria]) {
        categorias[item.categoria] = [];
      }
      categorias[item.categoria].push(item);
    });

    for (let cat in categorias) {
      let divCat = document.createElement("div");
      divCat.innerHTML = `<h3>${cat}</h3>`;

      categorias[cat].forEach(item => {
        const disponible = item.limite - item.reservados;

        let card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <div>
            <b>${item.subcategoria}</b><br>
            <small style="color:${disponible > 0 ? 'green' : 'gray'}">
              ${disponible > 0 
                ? "Disponible 🎁" 
                : "Este regalo ya fue elegido 💖"}
            </small>
          </div>
          <button ${disponible <= 0 ? "disabled" : ""}
          onclick="reservar('${item.subcategoria}')">
          Elegir
          </button>
        `;

        cont.appendChild(divCat);
        divCat.appendChild(card);
      });
    }

  } catch (error) {
    document.getElementById("contenido").innerHTML =
      "❌ Error conectando con el servidor";
  }
}

async function reservar(sub) {
  const nombre = document.getElementById("nombre").value.trim();

  if (!nombre) {
    mostrarMensaje("✨ Déjanos tu nombre para guardar tu regalo 💕");
    return;
  }

  try {
    await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        nombre: nombre,
        subcategoria: sub
      })
    });

    mostrarMensaje("💖 ¡Gracias por tu regalo! Nos hace muy felices ✨");
    cargar();

  } catch (error) {
    mostrarMensaje("😢 Error al enviar");
  }
}

async function verResumen() {
  const clave = document.getElementById("clave").value;

  if (clave !== CLAVE) {
    mostrarMensaje("🔒 Clave incorrecta");
    return;
  }

  const res = await fetch(API_URL + "?t=" + Date.now());
  const data = await res.json();

  let html = "<h3>Resumen</h3>";

  data.forEach(item => {
    if (item.personas) {
      html += `<p><b>${item.subcategoria}:</b> ${item.personas}</p>`;
    }
  });

  document.getElementById("resumen").innerHTML = html;
}

cargar();
</script>

</body>
</html>

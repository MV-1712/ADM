<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin VISIONARY</title>

<style>
body{
  font-family:Arial;
  background:#f4f4f4;
  padding:20px;
}

.container{
  max-width:600px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:10px;
}

input, textarea{
  width:100%;
  padding:10px;
  margin:5px 0;
}

button{
  width:100%;
  padding:12px;
  background:black;
  color:white;
  border:none;
  cursor:pointer;
  margin-top:10px;
}
</style>
</head>
<body>

<!-- 🟢 PÁGINA CREAR -->
<div class="container" id="pageCreate">

<h2>Panel Admin VISIONARY 🔥</h2>

<button onclick="mostrarLista()">📦 Ver productos</button>

<input id="nombre" placeholder="Nombre">
<input id="precio" placeholder="Precio">
<input id="precioAnterior" placeholder="Precio anterior">
<input id="categoria" placeholder="Categoría">
<input id="subcategoria" placeholder="Subcategoría">
<textarea id="descripcion" placeholder="Descripción"></textarea>

<input type="file" id="imagen" multiple>

<button onclick="guardar()">Guardar producto</button>

<h3>Variantes</h3>

<input id="color" placeholder="Color">
<input id="talla" placeholder="Talla">
<input id="stock" placeholder="Stock">

</div>

<!-- 🔵 PÁGINA EDITAR -->
<div class="container" id="pageEdit" style="display:none;">

<h2>📦 Editar productos</h2>

<button onclick="volver()">⬅ Volver</button>

<div id="lista2"></div>


</div>
<!-- 🧠 MODAL EDITAR -->
<div id="modal" style="
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
">

  <div style="
    background:white;
    padding:20px;
    width:90%;
    max-width:500px;
    border-radius:10px;
  ">

    <h2>✏️ Editar producto</h2>

    <input id="e_nombre" placeholder="Nombre">
    <input id="e_precio" placeholder="Precio">
    <input id="e_precioAnterior" placeholder="Precio anterior">
    <input id="e_categoria" placeholder="Categoría">
    <input id="e_subcategoria" placeholder="Subcategoría">
    <textarea id="e_descripcion" placeholder="Descripción"></textarea>

    <input type="file" id="e_imagen" multiple>

    <button onclick="actualizar()">💾 Guardar cambios</button>
    <button onclick="cerrarModal()">❌ Cerrar</button>

  </div>

</div>

</body>
<script>

const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbwQ_rX8KwOB09BL0IWfmqh-_JzIHErI8ce4zBcSZS0AfskdRAeFkKgm5KgR8MwlblgUcA/exec";

const CLOUD_NAME = "dfbryzre9";
const UPLOAD_PRESET = "visionary_upload";

// ===============================
// 🚀 GUARDAR PRODUCTO + VARIANTES
// ===============================
async function guardar(){

  try{

    const nombre = document.getElementById("nombre").value;
    const precio = document.getElementById("precio").value;
    const precioAnterior = document.getElementById("precioAnterior").value;
    const categoria = document.getElementById("categoria").value;
    const subcategoria = document.getElementById("subcategoria").value;
    const descripcion = document.getElementById("descripcion").value;

    const files = document.getElementById("imagen").files;

    if(files.length === 0){
      alert("Sube al menos una imagen");
      return;
    }

    const urls = [];

    for(let i = 0; i < files.length; i++){

      const formDataImg = new FormData();
      formDataImg.append("file", files[i]);
      formDataImg.append("upload_preset", UPLOAD_PRESET);

      const resCloud = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,{
        method:"POST",
        body:formDataImg
      });

      const dataCloud = await resCloud.json();

      if(dataCloud.secure_url){
        urls.push(dataCloud.secure_url);
      }
    }

    const imagen = urls[0] || "";
    const imagen2 = urls[1] || "";
    const imagen3 = urls[2] || "";
    const imagen4 = urls[3] || "";

    const variantes = [];

    const color = document.getElementById("color").value;
    const talla = document.getElementById("talla").value;
    const stock = document.getElementById("stock").value;

    if(color || talla || stock){
      variantes.push({
        Color: color,
        Talla: talla,
        Stock: stock
      });
    }

    const formData = new FormData();

    formData.append("action", "create");
    formData.append("Nombre", nombre);
    formData.append("Precio", precio);
    formData.append("PrecioAnterior", precioAnterior);
    formData.append("Categoria", categoria);
    formData.append("Subcategoria", subcategoria);
    formData.append("Descripcion", descripcion);

    formData.append("Imagen", imagen);
    formData.append("Imagen2", imagen2);
    formData.append("Imagen3", imagen3);
    formData.append("Imagen4", imagen4);

    formData.append("Variantes", JSON.stringify(variantes));

    const res = await fetch(URL_SCRIPT,{
      method:"POST",
      body: formData
    });

    const text = await res.text();

    console.log(text);

    alert("✅ Producto guardado correctamente");
    limpiar();

  }catch(err){
    console.error(err);
    alert("❌ Error general");
  }
}
// ===============================
// 🧹 LIMPIAR
// ===============================
function limpiar(){
  document.getElementById("nombre").value="";
  document.getElementById("precio").value="";
  document.getElementById("precioAnterior").value="";
  document.getElementById("categoria").value="";
  document.getElementById("subcategoria").value="";
  document.getElementById("descripcion").value="";
  document.getElementById("imagen").value="";

  document.getElementById("color").value="";
  document.getElementById("talla").value="";
  document.getElementById("stock").value="";
}

// ===============================
// ➕ GUARDAR SOLO VARIANTE
// ===============================
async function guardarVariante(){

  const productoID = document.getElementById("productoID").value;

  if(!productoID){
    alert("Pon el ID del producto");
    return;
  }

  try{

    const color = document.getElementById("color").value;
    const talla = document.getElementById("talla").value;
    const stock = document.getElementById("stock").value;

    const form = new FormData();

    form.append("tipo", "variante");
   
    form.append("Color", color);
    form.append("Talla", talla);
    form.append("Stock", stock);

    const res = await fetch(URL_SCRIPT,{
      method:"POST",
      body:form
    });

    const text = await res.text();

    console.log("Variante:", text);

    alert("✅ Variante guardada");

  }catch(err){
    console.error(err);
    alert("❌ Error variante");
  }
}
const API = URL_SCRIPT;

// ===============================
// 📥 CARGAR PRODUCTOS
// ===============================
function cargarProductos(){

  fetch(URL_SCRIPT)
  .then(r => r.json())
  .then(data => {

    let html = "";

    data.forEach(p => {

      html += `
        <div style="border:1px solid #ccc; padding:10px; margin:10px;">
          <b>${p.ID}</b><br>
          ${p.Nombre}<br>
          💰 ${p.Precio}<br>

          <img src="${p.Imagen}" width="80"><br>

          <button onclick='abrirModal(${JSON.stringify(p)})'>Editar</button>
        </div>
      `;
    });

    document.getElementById("lista2").innerHTML = html;
  });
}

function abrirModal(p){

  window.editingID = p.ID;

  document.getElementById("e_nombre").value = p.Nombre || "";
  document.getElementById("e_precio").value = p.Precio || "";
  document.getElementById("e_precioAnterior").value = p.PrecioAnterior || "";
  document.getElementById("e_categoria").value = p.Categoria || "";
  document.getElementById("e_subcategoria").value = p.Subcategoria || "";
  document.getElementById("e_descripcion").value = p.Descripcion || "";

  window.oldImages = {
    Imagen: p.Imagen || "",
    Imagen2: p.Imagen2 || "",
    Imagen3: p.Imagen3 || "",
    Imagen4: p.Imagen4 || ""
  };

  document.getElementById("modal").style.display = "flex";
}
// ===============================
// ✏️ EDITAR
// ===============================
function editar(p){

  document.getElementById("e_nombre").value = p.Nombre;
  document.getElementById("e_precio").value = p.Precio;
  document.getElementById("e_precioAnterior").value = p.PrecioAnterior;
  document.getElementById("e_categoria").value = p.Categoria;
  document.getElementById("e_subcategoria").value = p.Subcategoria;
  document.getElementById("e_descripcion").value = p.Descripcion;

  window.editingID = p.ID;

  window.oldImages = {
    Imagen: p.Imagen,
    Imagen2: p.Imagen2,
    Imagen3: p.Imagen3,
    Imagen4: p.Imagen4
  };

  document.getElementById("modal").style.display = "flex";
}
function cerrarModal(){
  document.getElementById("modal").style.display = "none";
}

// ===============================
// 💾 GUARDAR UPDATE
// ===============================
async function actualizar(){

  const files = document.getElementById("e_imagen").files;
  let urls = [];

  if(files.length > 0){

    for(let i = 0; i < files.length; i++){

      const formDataImg = new FormData();
      formDataImg.append("file", files[i]);
      formDataImg.append("upload_preset", UPLOAD_PRESET);

      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,{
        method:"POST",
        body:formDataImg
      });

      const data = await res.json();
      if(data.secure_url) urls.push(data.secure_url);
    }
  }

  const form = new FormData();

  form.append("action", "update");
  form.append("ID", window.editingID);

  form.append("Nombre", document.getElementById("e_nombre").value);
  form.append("Precio", document.getElementById("e_precio").value);
  form.append("PrecioAnterior", document.getElementById("e_precioAnterior").value);
  form.append("Categoria", document.getElementById("e_categoria").value);
  form.append("Subcategoria", document.getElementById("e_subcategoria").value);
  form.append("Descripcion", document.getElementById("e_descripcion").value);

  form.append("Imagen", urls[0] || window.oldImages.Imagen);
  form.append("Imagen2", urls[1] || window.oldImages.Imagen2);
  form.append("Imagen3", urls[2] || window.oldImages.Imagen3);
  form.append("Imagen4", urls[3] || window.oldImages.Imagen4);

  await fetch(URL_SCRIPT, { method:"POST", body: form });

  alert("✅ Actualizado");

  cerrarModal();
  cargarProductos();
}

function mostrarLista(){
  document.getElementById("pageCreate").style.display = "none";
  document.getElementById("pageEdit").style.display = "block";
  cargarProductos();
}

function volver(){
  document.getElementById("pageCreate").style.display = "block";
  document.getElementById("pageEdit").style.display = "none";
}
function goCreate(){
  showPage("create");
  history.pushState({page:"create"}, "", "#create");
}

function goList(){
  showPage("list");
  history.pushState({page:"list"}, "", "#list");
}

function goEdit(){
  showPage("edit");
  history.pushState({page:"edit"}, "", "#edit");
}
function showPage(page){

  document.getElementById("pageCreate").style.display = "none";
  document.getElementById("pageEdit").style.display = "none";
  document.getElementById("modal").style.display = "none";

  if(page === "create"){
    document.getElementById("pageCreate").style.display = "block";
  }

  if(page === "list"){
    document.getElementById("pageEdit").style.display = "block";
    cargarProductos();
  }

  if(page === "edit"){
    document.getElementById("modal").style.display = "flex";
  }
}
window.onpopstate = function(event){

  if(!event.state){
    showPage("create");
    return;
  }

  showPage(event.state.page);
};



</script>

</body>
</html>

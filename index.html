<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin VISIONARY</title>

<style>
body{

</head>
<body>

<h2>Panel Admin 🔥</h2>

<input id="nombre" placeholder="Nombre">
<input id="precio" placeholder="Precio">
<input id="precioAnterior" placeholder="Precio anterior">
<input id="categoria" placeholder="Categoría">
<input id="subcategoria" placeholder="Subcategoría">
<textarea id="descripcion" placeholder="Descripción"></textarea>

<input type="file" id="imagenFile">

<br><br>

<button onclick="guardarProducto()">Guardar producto</button>

<hr>

<h3>Productos</h3>
<div id="lista"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_DOMINIO",
  projectId: "TU_PROJECT_ID",
  storageBucket: "TU_BUCKET"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

window.guardarProducto = async function(){

  const files = document.getElementById("imagenesFiles").files;

  if(files.length === 0){
    alert("Sube al menos una imagen");
    return;
  }

  let urls = [];

  // 🔥 subir todas las imágenes
  for(let i=0; i<files.length; i++){
    const file = files[i];

    const storageRef = ref(storage, "productos/" + Date.now() + "_" + file.name);
    await uploadBytes(storageRef, file);

    const url = await getDownloadURL(storageRef);
    urls.push(url);
  }

  // 🔥 guardar producto
  await addDoc(collection(db, "productos"), {
    Nombre: nombre.value,
    Precio: precio.value,
    PrecioAnterior: precioAnterior.value,
    Categoria: categoria.value,
    Subcategoria: subcategoria.value,
    Descripcion: descripcion.value,

    Imagen: urls[0] || "",
    Imagen2: urls[1] || "",
    Imagen3: urls[2] || "",
    Imagen4: urls[3] || ""
  });

  alert("Producto guardado 🔥");
  cargarProductos();
};

async function cargarProductos(){
  const cont = document.getElementById("lista");
  cont.innerHTML = "";

  const snap = await getDocs(collection(db, "productos"));

  snap.forEach(docu => {
    const p = docu.data();

    cont.innerHTML += `
      <div class="card">
        <img src="${p.Imagen}">
        <b>${p.Nombre}</b><br>
        $${p.Precio}<br>
        <button onclick="eliminar('${docu.id}')">Eliminar</button>
      </div>
    `;
  });
}

window.eliminar = async function(id){
  await deleteDoc(doc(db, "productos", id));
  cargarProductos();
};

cargarProductos();

</script>

</body>
</html>

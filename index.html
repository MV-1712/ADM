<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin VISIONARY</title>

<style>
body{
  font-family:Arial;
  background:#f4f4f4;
  padding:20px;
}

input, textarea{
  width:100%;
  padding:10px;
  margin:5px 0;
}

button{
  padding:10px;
  background:black;
  color:white;
  border:none;
  cursor:pointer;
}

.card{
  background:white;
  padding:10px;
  margin:10px 0;
  border-radius:8px;
}

img{
  width:80px;
  border-radius:6px;
}
</style>
</head>
<body>

<h2>Panel Admin 🔥</h2>

<input id="nombre" placeholder="Nombre">
<input id="precio" placeholder="Precio">
<input id="precioAnterior" placeholder="Precio anterior">
<input id="categoria" placeholder="Categoría">
<input id="subcategoria" placeholder="Subcategoría">
<textarea id="descripcion" placeholder="Descripción"></textarea>

<input type="file" id="imagenesFiles" multiple>

<br><br>

<button id="btnGuardar">Guardar producto</button>

<hr>

<h3>Productos</h3>
<div id="lista"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import { 
  getFirestore, 
  collection, 
  addDoc, 
  getDocs, 
  deleteDoc, 
  doc 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import { 
  getStorage, 
  ref, 
  uploadBytes, 
  getDownloadURL 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";


// 🔥 CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyCnaRoFl94aKW-hjVf_cscrJEjm18URG3g",
  authDomain: "visionary-53354.firebaseapp.com",
  projectId: "visionary-53354",
  storageBucket: "visionary-53354.firebasestorage.app",
  messagingSenderId: "123477697424",
  appId: "1:123477697424:web:a2bd7b24ede2fbc1e20915"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);


// 🔥 GUARDAR PRODUCTO (SIN window, limpio)
async function guardarProducto(){

  try{

    console.log("CLICK FUNCIONA");

    const nombre = document.getElementById("nombre");
    const precio = document.getElementById("precio");
    const precioAnterior = document.getElementById("precioAnterior");
    const categoria = document.getElementById("categoria");
    const subcategoria = document.getElementById("subcategoria");
    const descripcion = document.getElementById("descripcion");

    const files = document.getElementById("imagenesFiles").files;

    if(files.length === 0){
      alert("Sube al menos una imagen");
      return;
    }

    let urls = [];

    // 🔥 subir imágenes
    for(let i=0; i<files.length; i++){
      const file = files[i];

      const storageRef = ref(storage, "productos/" + Date.now() + "_" + file.name);

      await uploadBytes(storageRef, file);

      const url = await getDownloadURL(storageRef);
      urls.push(url);
    }

    // 🔥 guardar en Firestore
    await addDoc(collection(db, "productos"), {
      Nombre: nombre.value,
      Precio: precio.value,
      PrecioAnterior: precioAnterior.value,
      Categoria: categoria.value,
      Subcategoria: subcategoria.value,
      Descripcion: descripcion.value,
      Imagen: urls[0] || "",
      Imagen2: urls[1] || "",
      Imagen3: urls[2] || "",
      Imagen4: urls[3] || ""
    });

    alert("Producto guardado 🔥");

    // limpiar
    nombre.value = "";
    precio.value = "";
    precioAnterior.value = "";
    categoria.value = "";
    subcategoria.value = "";
    descripcion.value = "";
    document.getElementById("imagenesFiles").value = "";

    cargarProductos();

  }catch(e){
    console.error("ERROR:", e);
    alert("Error: " + e.message);
  }

}


// 🔥 CARGAR PRODUCTOS
async function cargarProductos(){

  const cont = document.getElementById("lista");
  cont.innerHTML = "";

  const snap = await getDocs(collection(db, "productos"));

  snap.forEach(docu => {

    const p = docu.data();

    cont.innerHTML += `
      <div class="card">
        <img src="${p.Imagen}">
        <b>${p.Nombre}</b><br>
        $${p.Precio}<br>
        <button data-id="${docu.id}" class="btnEliminar">Eliminar</button>
      </div>
    `;
  });

  // 🔥 eventos eliminar (forma correcta en módulos)
  document.querySelectorAll(".btnEliminar").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.getAttribute("data-id");
      await deleteDoc(doc(db, "productos", id));
      cargarProductos();
    });
  });

}


// 🔥 EVENTO BOTÓN
document.getElementById("btnGuardar").addEventListener("click", guardarProducto);


// 🔥 INIT
cargarProductos();

</script>

</body>
</html>
